version: '3.8'

services:
  # Main LAEV-Agents Streamlit Application
  laev-app:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: laev-agents-app
    ports:
      - "8501:8501"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./.env:/app/.env:ro
      - chroma_data:/app/chroma_db
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - laev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - chromadb

  # ChromaDB Vector Database (for RAG)
  chromadb:
    image: chromadb/chroma:latest
    container_name: laev-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - laev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: laev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laev-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    profiles:
      - with-redis

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: laev-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - laev-network
    restart: unless-stopped
    depends_on:
      - laev-app
    profiles:
      - with-nginx

  # Demo Application (alternative UI)
  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
    container_name: laev-demo
    ports:
      - "7860:7860"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./.env:/app/.env:ro
      - ./python/src:/app/python/src:ro
    networks:
      - laev-network
    restart: unless-stopped
    profiles:
      - demo

networks:
  laev-network:
    driver: bridge

volumes:
  chroma_data:
    driver: local
  redis_data:
    driver: local
  huggingface_cache:
    driver: local
